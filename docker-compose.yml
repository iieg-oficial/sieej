services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    init: true
    environment:
      VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:-/api/administrador}
      VITE_NODE_ENV: ${VITE_NODE_ENV:-development}
      VITE_APP_ENV: ${VITE_APP_ENV:-dev}
      VITE_PORT: ${VITE_PORT:-5174}
      VITE_SITE_URL: ${VITE_SITE_URL:-}
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
      VITE_DISABLED_EDITION: ${VITE_DISABLED_EDITION:-false}
      VITE_GOOGLE_RECAPTCHA_SITE_KEY: ${VITE_GOOGLE_RECAPTCHA_SITE_KEY:-}
      BACKEND_DEV_TARGET: ${BACKEND_DEV_TARGET:-}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:${VITE_PORT:-5174}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${VITE_PORT:-5174}/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/sieej/}
        VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:-/api/administrador}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_APP_ENV: ${VITE_APP_ENV:-beta}
        VITE_DISABLED_EDITION: ${VITE_DISABLED_EDITION:-false}
        VITE_GOOGLE_RECAPTCHA_SITE_KEY: ${VITE_GOOGLE_RECAPTCHA_SITE_KEY:-}
    profiles: ["build"]
    environment:
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
    volumes:
      - ./frontend/dist:/output
    entrypoint: ["sh", "-c", "rm -rf /output/* /output/.[!.]* 2>/dev/null; cp -a /app/dist/. /output/ && chown -R ${HOST_UID}:${HOST_GID} /output"]

volumes:
  frontend-node-modules:

networks:
  default:
    name: ${NETWORK_NAME:-sieej-network}
