version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      eslint:
        patterns:
          - eslint
          - eslint-plugin-*
          - "@eslint/*"
      react:
        patterns:
          - react
          - react-dom
          - react-router
          - react-router-dom
          - react-hook-form

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
